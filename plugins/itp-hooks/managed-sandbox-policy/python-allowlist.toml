[[allow]]
path   = "sandbox_escape_gate.py"
reason = "Runs as a root-owned MANAGED Claude Code hook; its interpreter must be OS-owned (/usr/bin/python3) so an agent cannot swap it. bun/node live under user-writable ~/.bun and ~/.proto. Stdlib-only, Python 3.9 compatible (macOS system python)."

[[allow]]
path   = "sandbox_policy_session_check.py"
reason = "Same managed-hook constraint as sandbox_escape_gate.py: OS-owned interpreter, stdlib-only, Python 3.9."

[[allow]]
path   = "sandbox_diag_broker.py"
reason = "Read-only diagnostics broker installed root-owned beside the gate; same OS-owned-interpreter constraint (/usr/bin/python3, stdlib-only, 3.9)."

[[allow]]
path   = "test_sandbox_diag_broker.py"
reason = "unittest suite for sandbox_diag_broker.py on the same system interpreter it targets."

[[allow]]
path   = "install_managed_sandbox_policy.py"
reason = "Installer run under sudo on macOS and Linux; must use the same OS-owned python3 as the hooks it installs, stdlib-only."

[[allow]]
path   = "test_sandbox_escape_gate.py"
reason = "unittest suite for sandbox_escape_gate.py; runs on /usr/bin/python3 3.9 and Ubuntu python3 to prove both targets."
