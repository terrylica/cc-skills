# Lychee Link Checker Configuration — the ONE lychee config for this repository
# https://lychee.cli.rs/configuration/
#
# Read by:
#   - tasks/link-check.sh (moon run repo:link-check, part of repo:check), with --config lychee.toml
#   - plugins/statusline-tools/hooks/lychee-stop-hook.sh, which uses $GIT_ROOT/lychee.toml when present
#   - a bare `lychee .` from the repo root (lychee loads ./lychee.toml by default)
#
# Until 2026-10-21 (#33) a second file, .lychee.toml, held the stop hook's settings. This file is
# the union of both; neither caller lost an exclusion.
#
# Root directory for root-relative links (/docs/adr/...) is NOT set here: each caller passes
# --root-dir with the absolute repo root, which a committed config cannot know.

############################# Display ###############################
verbose = "error"      # Only show errors
no_progress = true     # Required for non-interactive shells

############################# Cache #################################
cache = true
max_cache_age = "7d"

############################# Runtime ###############################
timeout = 10
max_retries = 2
max_concurrency = 8

# Local files only, no network. Both callers already pass --offline; keeping it here too means a
# bare `lychee .` gives the same deterministic verdict as the gate.
offline = true

############################# Features ##############################
# lychee 0.24 turned this from a bool into an enum (none|anchor-only|text-only|full).
# `true` is a hard TOML parse error, which is why every lychee run in this repo
# died at config load. "anchor-only" is the closest equivalent to the old `true`.
include_fragments = "anchor-only"
include_verbatim = false
include_mail = false

############################# Path Exclusions #######################
# Regex patterns (not globs) for files to skip entirely
exclude_path = [
    "node_modules/",
    "\\.git/",
    "file-history/",
    "plugins/marketplaces/",
    "todos/.*\\.json$",
    "\\.venv/",
    "backups/",
    "__pycache__/",
    # Exclude auto-generated CHANGELOG files (semantic-release artifacts)
    "CHANGELOG\\.md$",
    # Test fixtures with intentionally broken links
    "tests/fixtures/",
    # Generated/copy directory (mirrors plugins/)
    "^\\.claude-plugin/",
    # Temporary research/scratch files
    "^tmp/",
]

############################# URL Exclusions ########################
# Patterns (regex) applied to link URLs
exclude = [
    "^mailto:",
    # Local-only references (/local/ paths are machine-specific, not in repo)
    "^file://.*/local/.*",
    # Template/placeholder URLs
    "mql5\\.com/en/articles/\\[ID\\]",
    # External URLs with access restrictions (paywall, rate limits)
    "medium\\.com/@ibm_ptc_security",
    # Shield.io badges (rate limited)
    "img\\.shields\\.io",
    # Semantic-release auto-generated links to private/non-existent repo history
    "github\\.com/terrylica/cc-skills/(compare|commit|issues)/",
]
