# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# The repo-level project. Every task here is a thin wrapper around a
# standalone bash script in `tasks/` — the orchestrator is swappable, the
# scripts are the truth (bootstrap-monorepo Nx-convergence rule 6). Each script
# runs identically via `bash tasks/<path>` with no moon involved, which is what
# makes replacing the orchestrator a config change rather than a rewrite.
#
# `script:` versus `command:` — the rule. moon forwards passthrough arguments
# (`moon run repo:<task> -- ARGS`) to a `command:` task and SILENTLY DROPS them
# for a `script:` task (moon docs, "Commands vs Scripts": "Passthrough args
# (from CLI)" is ✅ for command, ❌ for script). Nothing errors: the script just
# runs with no arguments. So any task whose program reads its arguments ("$@"
# in bash, process.argv in bun) MUST be declared `command:`; `script:` is only
# for argument-free tasks. Measured on moon 2.5.5, 2026-09-26: under `script:`,
# `moon run repo:release-augment -- --help` exited 2 with "missing --tag", and
# `moon run repo:release-history -- -- HEAD~2..HEAD` printed the default 10
# commits, byte-identical to the bare run. The argument-taking tasks are lint
# (validate-plugins.mjs reads --deps and --fix), triage-suite-log,
# release-augment, release-history and the commits-* family whose scripts
# forward "$@" (advise, health, status, pending-release, perf-baseline). Every
# other task's program reads no command-line arguments — install-hook and
# uninstall-hook included; every "$1" in tasks/release/full,
# tasks/release/preflight and the test-hooks runner belongs to a shell function
# or a nested `bash -c` worker body, not to the script's own command line.
#
# Every argument-taking `command:` task also sets `options.shell: false`. With
# the default (a shell, for the system toolchain) moon re-parses the
# passthrough arguments through bash, so `$HOME` inside a quoted commit subject
# given to commits-advise arrived expanded to the home directory path — measured
# on the same date. With `shell: false` moon spawns the program (`bash
# tasks/<path>`, or `bun scripts/validate-plugins.mjs --strict` for lint) with
# the arguments as a plain argv, and `$`, backticks, quotes and doubled spaces
# all arrive verbatim, exactly as a direct invocation would deliver them.
#
# Task IDs use `-` because moon reserves `:` as the project/task separator.
# `moon query tasks` renders this file as the machine-readable task surface.

layer: "application"
language: "bash"
tags: ["layer-control-plane"]

# Nothing here is a pure function of declared inputs — the audits scan the
# working tree, the release talks to GitHub, the tests spawn subprocesses — so
# caching is off by default and every task runs from the workspace root.
taskOptions:
  cache: false
  runFromWorkspaceRoot: true

tasks:
  # ── Uniform vocabulary (Nx-convergence rule 2) ─────────────────────────────
  test:
    description: "Marketplace-wide Bun unit suite over every tracked .ts/.mjs test."
    script: "bash tasks/test-marketplace-bun-unit-suite-for-tracked-typescript-and-mjs-tests-excluding-live-browser-integration.sh"

  test-hooks:
    description: "Marketplace-wide hook regression suite (the bash test-file cohort under tasks/tests/)."
    script: "bash tasks/test-marketplace-hook-regression-suite"

  lint:
    description: "Validate every plugin's registration, manifest and skill frontmatter. Takes --deps (inter-plugin dependency graph) and --fix (fix instructions)."
    # `command`, not `script`: scripts/validate-plugins.mjs reads --deps and
    # --fix from process.argv, and its own summary tells the reader to "Run
    # with --deps". Declared `script:`, `moon run repo:lint -- --deps` printed
    # the same 18 lines as the bare run — dependency graph absent, the "Run
    # with --deps" hint still printed — measured on moon 2.5.5, 2026-09-26.
    # Passthrough arguments are appended after --strict; `check` runs this
    # task as a dependency with no arguments, so the gate is unchanged.
    command: "bun scripts/validate-plugins.mjs --strict"
    options:
      shell: false

  check:
    description: "Full local quality gate. Local-first CI/CD: this is what runs before a push, never GitHub Actions."
    # cli-spec-check was defined but NOT wired in here, so the machine-readable
    # CLI spec's own no-silent-drift control was never part of the gate CLAUDE.md
    # calls "what runs before a push". It sat red on a clean tree for ~14 days and
    # nothing reported it — the second occurrence of this exact failure (the prior
    # regen commit is titled "regenerate to unbreak the drift gate"). A gate that
    # is not in the gate is not a gate.
    deps: ["~:lint", "~:test", "~:test-hooks", "~:cli-spec-check", "~:verify-doc-counts"]

  # ── Link checking ──────────────────────────────────────────────────────────
  # DELIBERATELY NOT in `check.deps` yet: measured 235 broken internal links on a
  # clean tree 2026-09-03, so wiring it now would block every commit. Add it to
  # check.deps the moment the count reaches zero — and note that leaving a task
  # defined-but-unwired is exactly the failure this repo has now hit three times
  # (cli-spec-check, the perf-timing skip flag, and link checking itself, which
  # had a config, a 495-line hook script, and no caller for its entire life).
  # The difference here is that the omission is deliberate, dated and has an exit
  # condition, rather than being an accident nobody noticed.
  link-check:
    description: "Offline link check over every tracked markdown file (internal links only, no network)."
    script: "bash tasks/link-check.sh"

  # ── Suite-log triage ───────────────────────────────────────────────────────
  # Manual triage tool, deliberately NOT wired into `check` and deliberately
  # NOT living in tasks/tests/ (which is auto-discovered and would run it as a
  # test). Classifies a captured suite log into the known flake mechanisms:
  # CLASS A wall-clock gate (prints the MARGIN — 0.9% and 300% must never
  # render identically, because that distinction is the diagnosis), CLASS B
  # exit-code verdict, CLASS C genuine defect, and three outcomes that exist
  # because of #113 — VACUOUS (discovered N, executed 0: the log proves
  # nothing), PARTIAL (executed < discovered), and GREEN, which requires a
  # positive execution count rather than the mere absence of failures.
  # Anything matching no known mechanism lands in UNKNOWN, never the nearest
  # bucket, so a new mechanism has to announce itself. Self-test: `--self-test`
  # (8 cases). Given a single-test log rather than a suite log it reports
  # VACUOUS, since such logs carry no FILE-PASS lines.
  triage-suite-log:
    description: "Classify a hook-regression suite log into known flake mechanisms; --self-test runs 8 self-checks."
    # `command`, not `script`: this task TAKES ARGUMENTS (a log path, or
    # --self-test), and moon forwards `moon run repo:triage-suite-log -- ARGS`
    # only to `command`. Declared as `script` it silently receives nothing and
    # exits 2 on usage — measured, not assumed. `shell: false` for the reason
    # in the header: a log path must reach the script verbatim.
    command: "bash tasks/triage-hook-regression-suite-log-classifying-known-flake-mechanisms-wall-clock-scenario-gate-versus-subprocess-exit-code-verdict-with-unknown-bucket-for-unrecognised-failures.sh"
    options:
      cache: false
      shell: false

  # ── CLI spec (machine-readable docs doctrine) ──────────────────────────────
  cli-spec:
    description: "Regenerate cli_spec.json from every argparse CLI in the marketplace."
    script: "bash tasks/cli-spec.sh"

  cli-spec-check:
    description: "Fail if cli_spec.json has drifted from the CLIs on disk."
    script: "bash tasks/cli-spec-check.sh"

  # ── Documentation counts ───────────────────────────────────────────────────
  verify-doc-counts:
    # Root CLAUDE.md was found asserting a design-spec coverage that was wrong by
    # 32, a plugin count wrong by 1, and a CLI count wrong by 2. It is the first
    # file every agent reads, so a miscount there teaches every reader to distrust
    # the whole file. Hand-maintained tallies drift; this makes recounting a gate
    # instead of advice. It reports INCONCLUSIVE (non-zero) rather than passing if
    # a claim's pattern stops matching, so rewording a heading cannot silence it.
    description: "Fail if the counts asserted in CLAUDE.md / plugins/CLAUDE.md disagree with the filesystem."
    script: "bun scripts/verify-doc-counts.ts"

  # ── Release pipeline ───────────────────────────────────────────────────────
  # EXEMPT from the `deps: ["~:release-preflight"]` wiring below, deliberately.
  # `tasks/release/full` invokes preflight ITSELF, inside the orchestrator body,
  # so that iter-139's per-phase timing wrapper can measure the phase-1
  # wall-clock (see the "DO NOT restore an orchestrator-level preflight
  # dependency" comment block in tasks/release/full). Declaring the dependency here
  # would move preflight OUTSIDE that wrapper, run it twice, and silently
  # destroy the phase-1 number that iter-74 through iter-138 were built on. The
  # absence is asserted by Iter-139.C4 in
  # tasks/tests/test-iter137-138-139-140-…-sleep-2-elimination.sh:253. Do not
  # "correct" this for consistency with its siblings — the same declaration is
  # right on two tasks and wrong on this one (#138).
  release-full:
    description: "Primary release entry point: preflight, presync, semantic-release, marketplace sync, verify, chronicle, postflight. Requires GH_TOKEN and a clean tree."
    script: "bash tasks/release/full"

  release-dry:
    description: "Preview the version bump and changelog without tagging, pushing or publishing. Runs preflight first."
    # #138: this dependency used to be a `#MISE depends=["release:preflight"]`
    # line inside the script, read by nothing once mise was retired (41df0fe5).
    # `deps` is the mechanism moon actually honours; a failing preflight now
    # aborts the run before semantic-release is reached.
    deps: ["~:release-preflight"]
    script: "bash tasks/release/dry"

  release-status:
    description: "Current version, latest tag and release readiness."
    script: "bash tasks/release/status"

  release-preflight:
    description: "Phase 1: validate every release prerequisite. Exits non-zero on any failure."
    script: "bash tasks/release/preflight"

  release-version:
    description: "Phase 2: semantic-release version bump, changelog, git tag and GitHub release. Runs preflight first."
    # #138: this is the PUBLISHING entry point — it tags, writes the changelog,
    # creates the GitHub release and pushes — and `tasks/release/version` carries
    # no validation of its own (15 lines, no clean-tree check, no GH_TOKEN check,
    # no tests). Its guarantee lived entirely in a dead
    # `#MISE depends=["release:preflight"]` comment that nothing read, so the one
    # command where skipping validation is most expensive ran ungated. `deps` is
    # the mechanism moon actually honours.
    deps: ["~:release-preflight"]
    script: "bash tasks/release/version"

  release-sync:
    description: "Phase 3: marketplace clone update, hook installation and cache population."
    script: "bash tasks/release/sync"

  release-verify:
    description: "Phase 4: cross-validate marketplace.json, plugin manifests and the installed cache for drift."
    script: "bash tasks/release/verify"

  release-postflight:
    description: "Phase 5: lockfile drift, clean working directory and all-commits-pushed validation."
    script: "bash tasks/release/postflight"

  release-augment:
    description: "Reflow and enrich published release notes for GFM."
    command: "bash tasks/release/augment"
    options:
      shell: false

  release-history:
    description: "Soft-wrapped renderer for long-subject commit history."
    command: "bash tasks/release/history"
    options:
      shell: false

  release-clean:
    description: "Remove release scratch state."
    script: "bash tasks/release/clean"

  # ── Conventional-commit tooling ────────────────────────────────────────────
  commits-advise:
    description: "Dry-run advisor: classify a proposed commit subject and preview its semver bump."
    command: "bash tasks/commits/advise"
    options:
      shell: false

  commits-health:
    description: "Conformance report for recent commit subjects."
    command: "bash tasks/commits/health"
    options:
      shell: false

  commits-status:
    description: "Commit-tooling status: hook installed, advisor reachable."
    command: "bash tasks/commits/status"
    options:
      shell: false

  commits-pending-release:
    description: "What the next release would contain, and which commit triggers the bump."
    command: "bash tasks/commits/pending-release"
    options:
      shell: false

  commits-install-hook:
    description: "Install the commit-msg git hook that runs the strict-mode advisor."
    script: "bash tasks/commits/install-hook"

  commits-uninstall-hook:
    description: "Remove the commit-msg git hook."
    script: "bash tasks/commits/uninstall-hook"

  commits-perf-baseline:
    description: "Wall-clock perf baseline harness for the conventional-commits tooling."
    command: "bash tasks/commits/perf-baseline"
    options:
      shell: false
